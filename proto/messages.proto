syntax = "proto3";

package chat;

// Source de vérité du protocole. Dérivé des user stories dans
// ./user-stories.md — chaque message ci-dessous couvre une story v1 précise.
// Les sections "réservé post-v1" indiquent une intention d'architecture, pas
// un engagement de forme finale : à revalider avant implémentation.

// ═══════════════════════════════════
// TYPES COMMUNS
// ═══════════════════════════════════

// Son propre compte (`AuthResponse.me`) : seul message qui porte un email.
message User {
  uint64 id = 1;
  string email = 2;
  bool is_admin = 3;
  string pseudo = 4;         // vide tant que non choisi (story 34)
  uint64 avatar_version = 5; // 0 = pas de photo (story 37)
  Status status = 6;         // story 41 : choix mémorisé, jamais transmis aux autres
}

// Story 41 : statut choisi. « Hors ligne » n'en est pas un : c'est ce que voient les
// autres quand on est déconnecté ou invisible (cf. PresenceChanged).
enum Status {
  ONLINE = 0;
  INVISIBLE = 1;
}

// Profil public d'un utilisateur, tel que les autres le voient (story 36) : jamais
// l'email. `avatar_version` change à chaque nouvelle photo (id tiré du compteur
// global) : clé de cache côté client, futur paramètre d'URL HTTP (story 37).
message UserProfile {
  uint64 id = 1;
  string pseudo = 2;
  uint64 avatar_version = 3; // 0 = pas de photo
}

message Channel {
  uint64 id = 1;
  string name = 2; // vide pour un DM (type == DM) — le client dérive l'affichage de participant_ids

  enum Type {
    TEXT = 0;
    VOICE = 1; // réservé post-v1 (stories 18-22) — jamais émis en v1
    DM = 2;    // conversation privée 1-à-1 (stories 28-32)
  }
  Type type = 3;

  // Peuplé uniquement pour type == DM (exactement 2 users). Vide pour TEXT/VOICE —
  // ces salons restent visibles par tout le monde (story 8), pas de liste de membres.
  repeated uint64 participant_ids = 4;
}

// Conversation privée vue par un participant (stories 28-30).
message Conversation {
  Channel channel = 1;         // type == DM, participant_ids = les deux utilisateurs
  // Id du dernier message, 0 = aucun. Les ids viennent du compteur global : trier par
  // max(last_message_id, channel.id) trie par dernière activité (story 30).
  uint64 last_message_id = 2;
}

message Message {
  uint64 id = 1;
  uint64 channel_id = 2;
  uint64 user_id = 3;
  string content = 4;
  uint64 timestamp = 5;
  // Tombstone (story 13-15). Si true, "content" est vide et doit être ignoré
  // côté client — seule la suppression elle-même doit être reflétée.
  bool deleted = 6;
  uint64 reply_to_id = 7; // story 39 : message cité, même salon ; 0 = pas une réponse
  uint64 edited_at = 8;   // story 40 : ms epoch de la dernière modification ; 0 = jamais
}

// ═══════════════════════════════════
// CLIENT → SERVEUR
// ═══════════════════════════════════

message ClientEnvelope {
  string request_id = 1; // corrélation requête/réponse (uuid)
  oneof payload {
    RequestMagicLink request_magic_link = 2; // story 1
    AuthRequest       auth               = 3; // story 2
    SendMessage       send_message       = 4; // story 10
    DeleteMessage     delete_message     = 5; // story 13-14
    SyncRequest       sync               = 6; // story 12
    CreateChannel     create_channel     = 7; // story 7
    SetPseudo         set_pseudo         = 8; // stories 34-35
    SetAvatar         set_avatar         = 9; // story 37
    GetAvatar         get_avatar         = 10; // story 36
    EditMessage       edit_message       = 11; // story 40
    SetStatus         set_status         = 12; // story 41
    OpenDm            open_dm            = 13; // story 28

    WebRtcOffer       webrtc_offer       = 22; // story 18 — spike de validation, non-trickle

    // --- réservé post-v1, structure indicative seulement ---
    // JoinVoice    join_voice    = 20; // story 18
    // LeaveVoice   leave_voice   = 21; // story 21
    // IceCandidate ice_candidate = 23; // story 18
  }
}

message RequestMagicLink {
  string email = 1;
}

message AuthRequest {
  // Token du lien magique (consommé une seule fois) OU token de session reçu
  // dans un AuthResponse précédent (story 33) — le serveur essaie magic_link
  // d'abord, puis session. Auth valable pour toute la durée de la connexion
  // WebSocket courante (story 33), pas de champ token à reporter ailleurs.
  string token = 1;
}

message SendMessage {
  uint64 channel_id = 1;
  string content = 2;
  uint64 reply_to_id = 3; // story 39 ; 0 = pas une réponse. 404 si absent du salon
}

// Story 40. Auteur uniquement (403), pas sur un message supprimé (400). Réponse :
// MessageEdited (aussi diffusé).
message EditMessage {
  uint64 channel_id = 1;
  uint64 message_id = 2;
  string content = 3;
}

message DeleteMessage {
  uint64 channel_id = 1;
  uint64 message_id = 2;
  // Autorisation vérifiée côté serveur : auteur du message OU admin.
}

message SyncRequest {
  uint64 channel_id = 1;
  uint64 last_seen_id = 2;
}

message CreateChannel {
  string name = 1;
  // Autorisation vérifiée côté serveur : admin uniquement.
}

// Réponse : UserUpdated (aussi diffusé aux autres). 409 si le pseudo est pris.
message SetPseudo {
  string pseudo = 1;
}

// Story 28 : DM avec `user_id` (créé s'il n'existe pas, sinon l'existant). Réponse :
// DmOpened. 400 avec soi-même, 404 si l'utilisateur n'existe pas ou n'a pas de pseudo.
message OpenDm {
  uint64 user_id = 1;
}

// Réponse : StatusSet. Passer invisible annonce « hors ligne » aux autres tout de
// suite (story 41).
message SetStatus {
  Status status = 1;
}

// Image déjà recadrée/réduite par le client : PNG, JPEG ou WebP, ≤ 256 Kio.
// `image` vide = retirer la photo. Réponse : UserUpdated (aussi diffusé).
message SetAvatar {
  bytes image = 1;
}

// Transport WS faute de chemin HTTP pour les images (story 37). Réponse : Avatar,
// ou Error 404 si l'utilisateur n'a pas de photo.
message GetAvatar {
  uint64 user_id = 1;
}

// Spike de validation WebRTC (story 18) : échange SDP non-trickle (candidats hôte
// inclus directement dans le SDP, cf. user-stories.md § Signaling) — suffisant pour
// valider str0m+monoio+UDP en local. Le vrai flow (trickle ICE obligatoire) est post-v1.
message WebRtcOffer {
  string sdp = 1;
}

// ═══════════════════════════════════
// SERVEUR → CLIENT
// ═══════════════════════════════════

message ServerEnvelope {
  string request_id = 1; // vide pour les événements non sollicités (broadcast)
  oneof payload {
    MagicLinkSent   magic_link_sent   = 2;
    AuthResponse    auth_response     = 3;
    NewMessage      new_message       = 4;
    MessageDeleted  message_deleted   = 5;
    SyncResponse    sync_response     = 6;
    ChannelCreated  channel_created   = 7;
    Error           error             = 8;
    UserUpdated     user_updated      = 9;
    Avatar          avatar            = 10;
    MessageEdited   message_edited    = 11;
    StatusSet       status_set        = 12;
    PresenceChanged presence_changed  = 13;
    DmOpened        dm_opened         = 14;
  }
}

// Ack volontairement vide : ne révèle pas si l'email correspond à un compte
// existant (évite l'énumération de comptes).
message MagicLinkSent {}

message AuthResponse {
  User me = 1;
  repeated Channel channels = 2; // tous les salons (story 8)
  // À persister côté client (ex. localStorage) et renvoyer dans un futur
  // AuthRequest.token pour reprendre la session sans repasser par le lien
  // magique (story 33). Valide indéfiniment (story 6).
  string session_token = 3;
  // Profils de tous les utilisateurs qui ont choisi un pseudo (story 36), `me` compris.
  repeated UserProfile users = 4;
  // Story 23 : utilisateurs vus en ligne par les autres à cet instant (ni invisibles,
  // ni dans leurs 15 premières secondes, story 42). Peut inclure `me`.
  repeated uint64 online_user_ids = 5;
  // Story 30 : mes conversations privées (celles que j'ai ouvertes ou qui ont reçu un
  // message), non triées.
  repeated Conversation dms = 6;
}

// Broadcast à tous les clients connectés, indépendamment du salon affiché
// côté client (voir décision de conception dans user-stories.md).
message NewMessage {
  Message message = 1;
}

// Story 40 : message complet après modification (broadcast, comme NewMessage).
message MessageEdited {
  Message message = 1;
}

message MessageDeleted {
  uint64 channel_id = 1;
  uint64 message_id = 2;
}

message SyncResponse {
  uint64 channel_id = 1;
  repeated Message messages = 2; // inclut les messages deleted=true
}

message ChannelCreated {
  Channel channel = 1; // broadcast
}

// Pseudo ou photo d'un utilisateur créé/modifié (stories 34-37). Broadcast aux autres,
// réponse directe à l'auteur du changement.
message UserUpdated {
  UserProfile profile = 1;
}

// Réponse à OpenDm ; aussi poussé (request_id vide) à l'autre participant avant le
// premier message du DM (story 28), et aux autres connexions de celui qui l'ouvre.
// Les NewMessage / MessageEdited / MessageDeleted d'un DM ne vont qu'à ses deux
// participants (story 29).
message DmOpened {
  Conversation conversation = 1;
}

// Ack de SetStatus, à l'auteur seul (le statut n'est jamais transmis aux autres).
message StatusSet {
  Status status = 1;
}

// Story 23 : un utilisateur apparaît en ligne ou hors ligne pour les autres (délais
// et invisibilité déjà appliqués par le serveur, story 42). Diffusé à tous.
message PresenceChanged {
  uint64 user_id = 1;
  bool online = 2;
}

message Avatar {
  uint64 user_id = 1;
  uint64 avatar_version = 2;
  bytes image = 3;
}

message Error {
  uint32 code = 1;
  string message = 2;
}
