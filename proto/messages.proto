syntax = "proto3";

package chat;

// Source de vérité du protocole. Dérivé des user stories dans
// ./user-stories.md — chaque message ci-dessous couvre une story v1 précise.
// Les sections "réservé post-v1" indiquent une intention d'architecture, pas
// un engagement de forme finale : à revalider avant implémentation.

// ═══════════════════════════════════
// TYPES COMMUNS
// ═══════════════════════════════════

// Son propre compte (`AuthResponse.me`) : seul message qui porte un email.
message User {
  uint64 id = 1;
  string email = 2;
  bool is_admin = 3;
  string pseudo = 4;         // vide tant que non choisi (story 34)
  uint64 avatar_version = 5; // 0 = pas de photo (story 37)
  Status status = 6;         // story 41 : choix mémorisé, jamais transmis aux autres
  string bio = 7;            // story 43 : description, vide = aucune
  Theme theme = 8;           // story 55 : préférence privée, jamais transmise aux autres
  bool has_password = 9;     // story 67 : renseigné à l'envoi de `me` (le hash vit à part)
}

// Story 55.
enum Theme {
  SYSTEM = 0; // suit le thème de l'OS
  LIGHT = 1;
  DARK = 2;
}

// Story 41 : statut choisi. « Hors ligne » n'en est pas un : c'est ce que voient les
// autres quand on est déconnecté ou invisible (cf. PresenceChanged).
enum Status {
  ONLINE = 0;
  INVISIBLE = 1;
}

// Profil public d'un utilisateur, tel que les autres le voient (story 36) : jamais
// l'email. `avatar_version` change à chaque nouvelle photo (id tiré du compteur
// global) : clé de cache côté client, futur paramètre d'URL HTTP (story 37).
message UserProfile {
  uint64 id = 1;
  string pseudo = 2;
  uint64 avatar_version = 3; // 0 = pas de photo
  string bio = 4;            // story 43 : description, vide = aucune
}

message Channel {
  uint64 id = 1;
  string name = 2; // vide pour un DM (type == DM) — le client dérive l'affichage de participant_ids

  enum Type {
    TEXT = 0;
    VOICE = 1; // réservé post-v1 (stories 18-22) — jamais émis en v1
    DM = 2;    // conversation privée 1-à-1 (stories 28-32)
  }
  Type type = 3;

  // Peuplé uniquement pour type == DM (exactement 2 users). Vide pour TEXT/VOICE —
  // ces salons restent visibles par tout le monde (story 8), pas de liste de membres.
  repeated uint64 participant_ids = 4;
}

// Conversation privée vue par un participant (stories 28-30).
message Conversation {
  Channel channel = 1;         // type == DM, participant_ids = les deux utilisateurs
  // Id du dernier message, 0 = aucun. Les ids viennent du compteur global : trier par
  // max(last_message_id, channel.id) trie par dernière activité (story 30).
  uint64 last_message_id = 2;
}

message Message {
  uint64 id = 1;
  uint64 channel_id = 2;
  uint64 user_id = 3;
  // Texte libre ; `/media/{id}` y est une image ou un fichier (story 27), `<@{id}>`
  // une mention (story 62).
  string content = 4;
  uint64 timestamp = 5;
  // Tombstone (story 13-15). Si true, "content" est vide et doit être ignoré
  // côté client — seule la suppression elle-même doit être reflétée.
  bool deleted = 6;
  uint64 reply_to_id = 7; // story 39 : message cité, même salon ; 0 = pas une réponse
  uint64 edited_at = 8;   // story 40 : ms epoch de la dernière modification ; 0 = jamais
}

// Story 27 : image envoyée par HTTP (`POST /media`), désignée dans les messages par
// le lien `/media/{id}`. Le contenu ne passe jamais par le WebSocket.
message Media {
  string id = 1;        // UUID v4 aléatoire : non devinable (story 48)
  string mime = 2;      // image/png, image/jpeg, image/webp, image/gif
  uint64 size = 3;      // octets
  uint32 width = 4;
  uint32 height = 5;
  uint64 owner_id = 6;  // seul à pouvoir la supprimer pour tout le monde (story 50)
  uint64 created_at = 7; // ms epoch
  // Story 51 : nom du fichier (assaini par le serveur). Un fichier qui n'est ni une
  // image propre, ni une vidéo (story 54, video/*), ni un son (story 61, audio/*) a
  // mime = application/octet-stream et width = height = 0.
  string name = 8;
  // Story 52 : dossier compressé en ZIP par le client — nombre de fichiers et taille
  // d'origine, déclarés par le client (informatifs). 0 = pas un dossier.
  uint32 folder_files = 9;
  uint64 folder_size = 10;
}

// En-têtes de `POST /media` (story 51-52) : `X-Media-Name` (nom encodé en
// pourcentage), `X-Folder-Files` et `X-Folder-Size` pour un dossier.
// Corps de la réponse HTTP 201 à `POST /media` (story 48 : quota après l'envoi ;
// quota_total 0 = illimité). Les erreurs HTTP portent un `Error` en corps.
message MediaUploaded {
  Media media = 1;
  uint64 quota_used = 2;
  uint64 quota_total = 3;
}

// Stories 57-60 : réglages de notification, mémorisés avec le compte, jamais transmis
// aux autres. Un nouveau champ va toujours à la fin (persisté en bincode, codec.rs).
message Settings {
  string sound = 1;                    // id d'un son du client ("pop", "ding"…), "" = aucun
  bool desktop_notifications = 2;      // story 59 : popups OS
  // Story 58, remplacé par channel_rules / person_rules (story 63) : plus lu ni écrit,
  // gardé pour que les dumps existants restent lisibles (bincode, codec.rs).
  repeated NotificationRule rules = 3;
  repeated ChannelRule channel_rules = 4; // story 63 : une par salon réglé
  repeated PersonRule person_rules = 5;   // story 63 : une par personne réglée
}

// Obsolète (story 58), cf. Settings.rules.
message NotificationRule {
  uint64 channel_id = 1;
  bool muted = 2;
  bool silent = 3;
}

// Story 63 : ce qui notifie dans un salon.
enum ChannelLevel {
  MENTIONS = 0; // défaut : seulement les mentions de moi
  ALL = 1;      // chaque message
  NOTHING = 2;  // rien (badge grisé)
}

// Story 63 : réglage d'un salon. Absent = mentions seulement, avec son.
message ChannelRule {
  uint64 channel_id = 1;
  ChannelLevel level = 2;
  bool silent = 3;
}

// Story 63 : réglage d'une personne. Absent = tout notifier, avec son.
message PersonRule {
  uint64 user_id = 1;
  bool dm_muted = 2;       // ses messages privés ne notifient pas (badge grisé)
  bool dm_silent = 3;      // … ou sans son
  bool mentions_muted = 4; // ses mentions de moi dans les salons ne notifient pas
  bool mentions_silent = 5;
}

// Story 56 : non-lus d'une conversation à la connexion.
message Unread {
  uint64 channel_id = 1;
  uint64 last_read_id = 2; // 0 = jamais lu
  uint32 count = 3;        // messages des autres, non supprimés, plafonné à 100
  uint32 mentions = 4;     // story 62 : parmi eux, ceux qui me mentionnent (`<@{moi}>`)
}

// ═══════════════════════════════════
// CLIENT → SERVEUR
// ═══════════════════════════════════

message ClientEnvelope {
  string request_id = 1; // corrélation requête/réponse (uuid)
  oneof payload {
    RequestMagicLink request_magic_link = 2; // story 1
    AuthRequest       auth               = 3; // story 2
    SendMessage       send_message       = 4; // story 10
    DeleteMessage     delete_message     = 5; // story 13-14
    SyncRequest       sync               = 6; // story 12
    CreateChannel     create_channel     = 7; // story 7
    SetPseudo         set_pseudo         = 8; // stories 34-35
    SetAvatar         set_avatar         = 9; // story 37
    GetAvatar         get_avatar         = 10; // story 36
    EditMessage       edit_message       = 11; // story 40
    SetStatus         set_status         = 12; // story 41
    OpenDm            open_dm            = 13; // story 28
    SetBio            set_bio            = 14; // story 43
    DeleteMedia       delete_media       = 15; // story 50
    GetMedia          get_media          = 16; // story 51
    RequestDownload   request_download   = 17; // story 53
    SetTheme          set_theme          = 18; // story 55
    MarkRead          mark_read          = 19; // story 56
    SetSettings       set_settings       = 20; // stories 57-60
    WebRtcOffer       webrtc_offer       = 22; // story 18 — spike de validation, non-trickle

    Heartbeat         heartbeat          = 29; // story 69
    PasswordLogin     password_login     = 30; // story 67
    AcceptInvite      accept_invite      = 31; // story 66
    SetPassword       set_password       = 32; // story 67
    CreateInvite      create_invite      = 33; // story 65 (admin)
    ListInvites       list_invites       = 34; // story 65 (admin)
    RevokeInvite      revoke_invite      = 35; // story 65 (admin)
    CreateLoginLink   create_login_link  = 36; // story 68 (admin)

    // --- réservé post-v1, structure indicative seulement (numéros libres à partir
    // de 40 ; 20, 21 et 23, d'abord envisagés ici, ont été pris entre-temps) ---
    // JoinVoice    join_voice    = 40; // story 18
    // LeaveVoice   leave_voice   = 41; // story 21
    // IceCandidate ice_candidate = 42; // story 18
  }
}

// Stories 1-2, remplacées par les stories 65-68 : refusé (403) — les liens ne sont
// plus créés que par l'admin.
message RequestMagicLink {
  string email = 1;
}

// Story 69 : « tu es là ? » du client. Réponse : HeartbeatAck.
message Heartbeat {}

// Story 67. Réponse : AuthResponse, ou 401 « email ou mot de passe incorrect »
// (429 après 10 échecs sur cet email, pendant 15 min).
message PasswordLogin {
  string email = 1;
  string password = 2;
}

// Story 66 : création du compte depuis un lien d'invitation. Réponse : AuthResponse.
message AcceptInvite {
  string token = 1;
  string email = 2;
  string pseudo = 3;
  string password = 4;
}

// Story 67 : `current` vide si le compte n'a pas encore de mot de passe. Réponse :
// PasswordSet.
message SetPassword {
  string current = 1;
  string password = 2;
}

// Story 65 (admin) : invitation à usage unique, valable `ttl_seconds` (30 jours max).
// Réponse : InviteCreated.
message CreateInvite {
  uint32 ttl_seconds = 1;
}

// Story 65 (admin). Réponse : Invites.
message ListInvites {}

// Story 65 (admin). Réponse : InviteRevoked.
message RevokeInvite {
  string token = 1;
}

// Story 68 (admin) : lien de connexion à usage unique pour un membre. Réponse :
// LoginLinkCreated.
message CreateLoginLink {
  uint64 user_id = 1;
  uint32 ttl_seconds = 2;
}

message AuthRequest {
  // Token du lien magique (consommé une seule fois) OU token de session reçu
  // dans un AuthResponse précédent (story 33) — le serveur essaie magic_link
  // d'abord, puis session. Auth valable pour toute la durée de la connexion
  // WebSocket courante (story 33), pas de champ token à reporter ailleurs.
  string token = 1;
}

message SendMessage {
  uint64 channel_id = 1;
  string content = 2;
  uint64 reply_to_id = 3; // story 39 ; 0 = pas une réponse. 404 si absent du salon
}

// Story 40. Auteur uniquement (403), pas sur un message supprimé (400). Réponse :
// MessageEdited (aussi diffusé).
message EditMessage {
  uint64 channel_id = 1;
  uint64 message_id = 2;
  string content = 3;
}

message DeleteMessage {
  uint64 channel_id = 1;
  uint64 message_id = 2;
  // Autorisation vérifiée côté serveur : auteur du message OU admin.
}

message SyncRequest {
  uint64 channel_id = 1;
  // `limit` = 0 : tout ce qui suit `last_seen_id` (story 12).
  uint64 last_seen_id = 2;
  // Story 64 : `limit` > 0 (200 max) = page des `limit` messages qui précèdent
  // `before_id` (0 = les plus récents), rendus du plus ancien au plus récent.
  uint64 before_id = 3;
  uint32 limit = 4;
}

message CreateChannel {
  string name = 1;
  // Autorisation vérifiée côté serveur : admin uniquement.
}

// Réponse : UserUpdated (aussi diffusé aux autres). 409 si le pseudo est pris.
message SetPseudo {
  string pseudo = 1;
}

// Story 28 : DM avec `user_id` (créé s'il n'existe pas, sinon l'existant). Réponse :
// DmOpened. 400 avec soi-même, 404 si l'utilisateur n'existe pas ou n'a pas de pseudo.
message OpenDm {
  uint64 user_id = 1;
}

// Story 43 : trimée, ≤ 190 caractères, retours à la ligne permis ; vide = retirer.
// Réponse : UserUpdated (aussi diffusé).
message SetBio {
  string bio = 1;
}

// Story 50 : « supprimer pour tout le monde », par celui qui l'a envoyée (403 sinon).
// Réponse : MediaDeleted (aussi diffusé à tous).
message DeleteMedia {
  string media_id = 1;
}

// Story 51 : métadonnées de plusieurs médias sans les télécharger. Réponse :
// MediaInfo (les ids inconnus ou supprimés en sont absents).
message GetMedia {
  repeated string media_ids = 1;
}

// Story 53 : ticket de téléchargement natif (60 s). Réponse : DownloadTicket.
// Story 54 : `inline` = ticket de lecture (image ou vidéo servie en ligne, requêtes
// Range), valable 1 h et prolongé à chaque requête.
message RequestDownload {
  string media_id = 1;
  bool inline = 2;
}

// Story 56 : tout jusqu'à `message_id` compris est lu (le marqueur ne recule jamais).
// Réponse : ReadMarked, aussi poussé à mes autres connexions.
message MarkRead {
  uint64 channel_id = 1;
  uint64 message_id = 2;
}

// Stories 57-60 : remplace tous mes réglages. Réponse : SettingsSet, aussi poussé à
// mes autres connexions.
message SetSettings {
  Settings settings = 1;
}

// Story 55. Réponse : ThemeSet, aussi poussé à mes autres connexions.
message SetTheme {
  Theme theme = 1;
}

// Réponse : StatusSet. Passer invisible annonce « hors ligne » aux autres tout de
// suite (story 41).
message SetStatus {
  Status status = 1;
}

// Image déjà recadrée/réduite par le client : PNG, JPEG ou WebP, ≤ 256 Kio.
// `image` vide = retirer la photo. Réponse : UserUpdated (aussi diffusé).
message SetAvatar {
  bytes image = 1;
}

// Transport WS faute de chemin HTTP pour les images (story 37). Réponse : Avatar,
// ou Error 404 si l'utilisateur n'a pas de photo.
message GetAvatar {
  uint64 user_id = 1;
}

// Spike de validation WebRTC (story 18) : échange SDP non-trickle (candidats hôte
// inclus directement dans le SDP, cf. user-stories.md § Signaling) — suffisant pour
// valider str0m+monoio+UDP en local. Le vrai flow (trickle ICE obligatoire) est post-v1.
message WebRtcOffer {
  string sdp = 1;
}

// ═══════════════════════════════════
// SERVEUR → CLIENT
// ═══════════════════════════════════

message ServerEnvelope {
  string request_id = 1; // vide pour les événements non sollicités (broadcast)
  oneof payload {
    MagicLinkSent   magic_link_sent   = 2;
    AuthResponse    auth_response     = 3;
    NewMessage      new_message       = 4;
    MessageDeleted  message_deleted   = 5;
    SyncResponse    sync_response     = 6;
    ChannelCreated  channel_created   = 7;
    Error           error             = 8;
    UserUpdated     user_updated      = 9;
    Avatar          avatar            = 10;
    MessageEdited   message_edited    = 11;
    StatusSet       status_set        = 12;
    PresenceChanged presence_changed  = 13;
    DmOpened        dm_opened         = 14;
    MediaDeleted    media_deleted     = 15;
    MediaInfo       media_info        = 16;
    DownloadTicket  download_ticket   = 17;
    ThemeSet        theme_set         = 18;
    ReadMarked      read_marked       = 19;
    SettingsSet     settings_set      = 20;
    HeartbeatAck    heartbeat_ack     = 21;
    PasswordSet     password_set      = 22;
    InviteCreated   invite_created    = 23;
    Invites         invites           = 24;
    InviteRevoked   invite_revoked    = 25;
    LoginLinkCreated login_link_created = 26;
  }
}

// Ack volontairement vide : ne révèle pas si l'email correspond à un compte
// existant (évite l'énumération de comptes).
message MagicLinkSent {}

message AuthResponse {
  User me = 1;
  repeated Channel channels = 2; // tous les salons (story 8)
  // À persister côté client (ex. localStorage) et renvoyer dans un futur
  // AuthRequest.token pour reprendre la session sans repasser par le lien
  // magique (story 33). Valide indéfiniment (story 6).
  string session_token = 3;
  // Profils de tous les utilisateurs qui ont choisi un pseudo (story 36), `me` compris.
  repeated UserProfile users = 4;
  // Story 23 : utilisateurs vus en ligne par les autres à cet instant (ni invisibles,
  // ni dans leurs 15 premières secondes, story 42). Peut inclure `me`.
  repeated uint64 online_user_ids = 5;
  // Story 30 : mes conversations privées (celles que j'ai ouvertes ou qui ont reçu un
  // message), non triées.
  repeated Conversation dms = 6;
  // Story 56 : non-lus de chaque conversation visible (salons et mes DM).
  repeated Unread unread = 7;
  Settings settings = 8; // stories 57-60
}

// Broadcast à tous les clients connectés, indépendamment du salon affiché
// côté client (voir décision de conception dans user-stories.md).
message NewMessage {
  Message message = 1;
}

// Story 40 : message complet après modification (broadcast, comme NewMessage).
message MessageEdited {
  Message message = 1;
}

message MessageDeleted {
  uint64 channel_id = 1;
  uint64 message_id = 2;
}

message SyncResponse {
  uint64 channel_id = 1;
  repeated Message messages = 2; // inclut les messages deleted=true
  bool has_more = 3;             // story 64 : en mode page, des messages plus anciens restent
}

message ChannelCreated {
  Channel channel = 1; // broadcast
}

// Pseudo ou photo d'un utilisateur créé/modifié (stories 34-37). Broadcast aux autres,
// réponse directe à l'auteur du changement.
message UserUpdated {
  UserProfile profile = 1;
}

// Réponse à OpenDm ; aussi poussé (request_id vide) à l'autre participant avant le
// premier message du DM (story 28), et aux autres connexions de celui qui l'ouvre.
// Les NewMessage / MessageEdited / MessageDeleted d'un DM ne vont qu'à ses deux
// participants (story 29).
message DmOpened {
  Conversation conversation = 1;
}

message HeartbeatAck {}

message PasswordSet {}

// Story 65 : lien `{origine}/?invite={token}`.
message Invite {
  string token = 1;
  uint64 created_at = 2; // ms epoch
  uint64 expires_at = 3; // ms epoch
}

message InviteCreated {
  Invite invite = 1;
}

message Invites {
  repeated Invite invites = 1; // en cours, de la plus récente à la plus ancienne
}

message InviteRevoked {
  string token = 1;
}

// Story 68 : lien `{origine}/?token={token}` (lien magique, usage unique).
message LoginLinkCreated {
  string token = 1;
  uint64 expires_at = 2;
}

// Story 56 : à moi et à mes autres connexions seulement.
message ReadMarked {
  uint64 channel_id = 1;
  uint64 last_read_id = 2; // marqueur effectif (jamais en arrière)
}

message SettingsSet {
  Settings settings = 1;
}

// Story 55 : thème choisi, à l'auteur et à ses autres connexions seulement.
message ThemeSet {
  Theme theme = 1;
}

// Ack de SetStatus, à l'auteur seul (le statut n'est jamais transmis aux autres).
message StatusSet {
  Status status = 1;
}

// Story 23 : un utilisateur apparaît en ligne ou hors ligne pour les autres (délais
// et invisibilité déjà appliqués par le serveur, story 42). Diffusé à tous.
message PresenceChanged {
  uint64 user_id = 1;
  bool online = 2;
}

// Story 50 : image supprimée du serveur ; partout où son lien apparaît, le client
// affiche « image supprimée ». Diffusé à tous (l'id, aléatoire, ne révèle rien).
message MediaDeleted {
  string media_id = 1;
}

message MediaInfo {
  repeated Media media = 1;
}

// Story 53 : `GET /media/{media_id}?ticket={ticket}`, valable 60 s (1 h glissante pour
// un ticket de lecture, story 54).
message DownloadTicket {
  string media_id = 1;
  string ticket = 2;
}

message Avatar {
  uint64 user_id = 1;
  uint64 avatar_version = 2;
  bytes image = 3;
}

message Error {
  uint32 code = 1;
  string message = 2;
}
