[package]
name = "back-end"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-lc-rs = "1"
base64 = "0.22"
bcrypt = "0.17"
bincode = "1"
blowfish = { version = "0.9", features = ["bcrypt"] }
crc32fast = "1.4"
futures = "0.3"
httparse = "1.10.1"
imagesize = "0.13"
monoio = { version = "0.2.4", features = ["iouring", "sync", "renameat", "unlinkat"] }
monoio-rustls = "0.4.0"
oxidart = { version = "0.6.0", path = "../../radixox/oxidart" }
prost = "0.14.4"
radixox-lib = { path = "../../radixox/radixox-lib" }
rust-embed = "8.11.0"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-acme = "0.15.3"
serde = { version = "1.0.228", features = ["derive"] }
str0m = "0.21.0"
uuid = { version = "1.23.4", features = ["v4"] }

# bcrypt au coût 12 : sans optimisation, une connexion prendrait plusieurs secondes en dev.
[profile.dev.package.blowfish]
opt-level = 3

# Le serveur est une petite machine : LTO complet. Le processeur cible
# (`-C target-cpu=…`, celui du serveur) est passé par le script de déploiement.
[profile.release]
lto = "fat"
codegen-units = 1

[build-dependencies]
prost-build = "0.14.4"
