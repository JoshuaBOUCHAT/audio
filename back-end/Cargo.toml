[package]
name = "back-end"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "1"
httparse = "1.10.1"
monoio = { version = "0.2.4", features = ["iouring"] }
monoio-rustls = "0.4.0"
oxidart = { version = "0.5.0", path = "../../radixox/oxidart" }
prost = "0.14.4"
rust-embed = "8.11.0"
rustls-acme = "0.15.3"
serde = { version = "1.0.228", features = ["derive"] }
str0m = "0.21.0"
uuid = { version = "1.23.4", features = ["v4"] }

[build-dependencies]
prost-build = "0.14.4"
