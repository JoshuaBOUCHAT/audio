# Site nginx d'audio sur le mini-PC (option A, décidée le 2026-10-13) : le nginx
# déjà présent garde le port 443 pour les autres sites et relaie vers audio, qui
# écoute en local (AUDIO_LISTEN=127.0.0.1:8443). Certificat par certbot, comme les
# autres sites — écart à « zéro nginx » propre à ce déploiement : le binaire, lui,
# reste autonome. Le vocal (UDP) ne passera pas par ici.
# Installé par setup-nginx.sh (DOMAIN remplacé).

map $http_upgrade $audio_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name DOMAIN;
    ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Fichiers et dossiers : pas de limite de taille (quota géré par audio), envoi
    # transmis au fil de l'eau plutôt que d'abord stocké par nginx.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        # audio garde son propre TLS (cert auto-signé) même en local.
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        # WebSocket : upgrade transmis ; connexion ouverte bien au-delà du
        # heartbeat de 15 s.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $audio_connection;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
